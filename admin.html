
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Admin – Produkthantering</title>

  <link rel="stylesheet" href="css/admin.css">
  <script src="js/admin.js" defer></script>
</head>

<body>

  <header>
    <h1>Produktadministration</h1>
  </header>

  <main>

    <!-- Formulär för att lägga till produkter -->
    <section>
      <h2>Lägg till produkt</h2>


<details id="product-details">
  <summary id="product-summary">Add product</summary>

      <form id="product-form">

        <label for="title">Product Name</label>
        <input
          type="text"
          id="title"
          required
        >

        <label for="price">Price</label>
        <input type="number" id="price" min="0" step="0.01" required>

        <label for="description">Description</label>
        <textarea id="description"></textarea>

        <div id="image-field">
        <label for="product-image">Välj produktbild</label>
        <input
            type="file"
            id="product-image"
            name="product-image"
            accept="image/*"
        />
        </div>

        <label for="category">Category</label>
        <input type="text" id="category" required  >

        <button type="submit"> Add product </button>

      </form>
      </details>
    </section>

    
    <section>
      <h2>Alla produkter</h2>

      <p id="status" role="status" aria-live="polite"></p>

      <div id="product-list"></div>
    </section>

  </main>

</body>
</html>
